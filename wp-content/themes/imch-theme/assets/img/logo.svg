<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60">
  <defs>
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33" />
      <stop offset="100%" stop-color="#14385A" />
    </linearGradient>
  </defs>
  <!-- System Colored Rectangle Badge -->
  <rect x="0" y="4" width="130" height="52" rx="8" fill="url(#rectGrad)" stroke="#1F4E79" stroke-width="1.5"/>
  <rect x="5" y="9" width="120" height="42" rx="5" fill="none" stroke="#E8610C" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- ICHub Text inside Rectangle -->
  <text x="65" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="1">
    <tspan fill="#FFFFFF">IC</tspan><tspan fill="#E8610C">Hub</tspan>
  </text>
  <!-- Full Brand Typography Next to Badge -->
  <g transform="translate(142, 0)">
    <text x="0" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1F33" letter-spacing="1.2">INTERMOBILE</text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#E8610C" letter-spacing="2.5">CONTAINERS HUB</text>
  </g>
</svg>